name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Kept as discrete steps rather than one `pnpm test` so a failure is
      # identifiable from the job summary without opening the log.
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run format:check
      - run: pnpm run spec
      - run: pnpm run build
